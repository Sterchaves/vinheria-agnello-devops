
services:


  produtos-service:
    build: ./produtos-service
    image: vinheria-produtos:1.0
    container_name: vinheria-produtos
    ports:
      - "8443:8443"
    environment:
      PRODUTOS_API_KEY: ${PRODUTOS_API_KEY:?Configure PRODUTOS_API_KEY no arquivo .env}
      PRODUTOS_TLS_PASSWORD: ${PRODUTOS_TLS_PASSWORD:?Configure PRODUTOS_TLS_PASSWORD no arquivo .env}
    volumes:
      - ./security/certs/produtos-keystore.p12:/usr/local/tomcat/conf/certs/produtos-keystore.p12:ro
    networks:
      - vinheria-network


  carrinho-service:
    build: ./carrinho-service
    image: vinheria-carrinho:1.0
    container_name: vinheria-carrinho
    ports:
      - "8081:8080"
    environment:
      PRODUTOS_URL: https://produtos-service:8443
      PRODUTOS_API_KEY: ${PRODUTOS_API_KEY:?Configure PRODUTOS_API_KEY no arquivo .env}
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/usr/local/tomcat/conf/certs/carrinho-truststore.p12
        -Djavax.net.ssl.trustStorePassword=changeit
        -Djavax.net.ssl.trustStoreType=PKCS12
    volumes:
      - ./security/certs/carrinho-truststore.p12:/usr/local/tomcat/conf/certs/carrinho-truststore.p12:ro
    depends_on:
      - produtos-service
    networks:
      - vinheria-network

networks:
  vinheria-network:
    driver: bridge
